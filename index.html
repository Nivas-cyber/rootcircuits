<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RootCircuits — Hardware Built for Security Research</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<meta name="description" content="Professional hardware tools for cybersecurity researchers, penetration testers, embedded developers, and hardware security enthusiasts.">
<meta name="keywords" content="hardware security, cybersecurity tools, ESP32 probe, UART bridge, RFID NFC lab, IoT security, firmware flashing">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

<style>
:root {
  color-scheme: dark;
  --bg: #07070a;
  --bg2: #0d0e14;
  --card: #12131c;
  --card-hover: #181a26;
  --line: #222536;
  --line-glow: rgba(255, 42, 59, 0.25);
  --tx: #f0f2f6;
  --mut: #8b92a5;
  --silver: #c2c7d0;
  --red: #ff2a3b;
  --red2: #b30f1d;
  --red-glow: rgba(255, 42, 59, 0.4);
  --green: #00e676;
  --green-bg: rgba(0, 230, 118, 0.12);
  --amber: #ffab00;
  --amber-bg: rgba(255, 171, 0, 0.12);
  --cyan: #00e5ff;
  --cyan-bg: rgba(0, 229, 255, 0.12);
  --r: 14px;
  --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --font-head: 'Rajdhani', var(--font-sans);
  --font-mono: 'JetBrains Mono', monospace;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

*, *:before, *:after { box-sizing: inherit; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: 90px;
  background-color: var(--bg);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font: 400 15px/1.65 var(--font-sans);
  background-image: 
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 48px 48px;
  background-attachment: fixed;
  background-blend-mode: soft-light;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

body:before {
  content: "";
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(ellipse at 80% -20%, rgba(255, 42, 59, 0.15), transparent 60%),
    radial-gradient(ellipse at 20% 110%, rgba(0, 229, 255, 0.08), transparent 50%),
    var(--bg);
  opacity: 0.95;
  z-index: -1;
  pointer-events: none;
}

/* Typography */
h1, h2, h3, h4 {
  font-family: var(--font-head);
  letter-spacing: 0.03em;
  line-height: 1.15;
  margin: 0 0 0.5em;
  color: #fff;
  text-transform: uppercase;
}

h1 { font-size: clamp(2.4rem, 5.5vw, 4.2rem); font-weight: 700; }
h2 { font-size: clamp(1.7rem, 3.5vw, 2.4rem); font-weight: 700; }
h3 { font-size: 1.3rem; font-weight: 600; }
h4 { font-size: 0.95rem; font-weight: 600; letter-spacing: 0.12em; color: var(--silver); }

p { margin: 0 0 1em; }
p:last-child { margin-bottom: 0; }
a { color: inherit; text-decoration: none; }

.wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; width: 100%; }

/* Header & Nav */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(7, 7, 10, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
  transition: border-color 0.3s;
}

.nav {
  display: flex;
  align-items: center;
  gap: 20px;
  height: 72px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font: 700 1.45rem var(--font-head);
  letter-spacing: 0.08em;
  color: #fff;
  transition: transform 0.2s;
}

.brand:hover { transform: scale(1.02); }

.brand-icon {
  width: 38px;
  height: 38px;
  background: linear-gradient(135deg, rgba(255, 42, 59, 0.2), rgba(179, 15, 29, 0.4));
  border: 1px solid var(--red);
  border-radius: 10px;
  display: grid;
  place-items: center;
  box-shadow: 0 0 15px rgba(255, 42, 59, 0.25);
}

.brand b { color: var(--red); }

nav.links {
  display: flex;
  gap: 4px;
  margin-left: auto;
}

nav.links a {
  padding: 8px 14px;
  border-radius: 8px;
  color: var(--mut);
  font-weight: 500;
  font-size: 0.92rem;
  transition: all 0.2s ease;
}

nav.links a:hover {
  color: var(--tx);
  background: rgba(255, 255, 255, 0.05);
}

nav.links a.on {
  color: #fff;
  background: rgba(255, 42, 59, 0.12);
  border: 1px solid rgba(255, 42, 59, 0.3);
}

/* Header Action Buttons */
.nav-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.srch {
  background: #0b0c12;
  border: 1px solid var(--line);
  color: var(--tx);
  border-radius: 10px;
  padding: 9px 14px;
  min-height: 42px;
  font-family: var(--font-sans);
  font-size: 0.9rem;
  transition: all 0.2s;
}

.srch:focus, input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--red);
  box-shadow: 0 0 0 3px rgba(255, 42, 59, 0.2);
}

.navsr { width: 180px; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: 10px;
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: 0.92rem;
  border: 1px solid var(--line);
  background: #141520;
  color: var(--tx);
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  min-height: 44px;
  user-select: none;
  white-space: nowrap;
}

.btn:hover {
  border-color: var(--silver);
  color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
}

.btn:active { transform: translateY(0); }

.btn.p {
  background: linear-gradient(180deg, var(--red), var(--red2));
  border-color: var(--red);
  color: #fff;
  box-shadow: 0 4px 18px rgba(255, 42, 59, 0.3);
}

.btn.p:hover {
  box-shadow: 0 8px 26px rgba(255, 42, 59, 0.5);
  border-color: #ff5e6c;
}

.btn.s {
  padding: 8px 14px;
  min-height: 38px;
  font-size: 0.85rem;
  border-radius: 8px;
}

.btn.icon-only {
  width: 44px;
  height: 44px;
  padding: 0;
  position: relative;
}

.cart-badge {
  position: absolute;
  top: -4px;
  right: -4px;
  background: var(--red);
  color: #fff;
  font: 700 0.72rem var(--font-mono);
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  border: 2px solid var(--bg);
}

.burger {
  display: none;
  background: none;
  border: 1px solid var(--line);
  color: var(--tx);
  border-radius: 10px;
  width: 44px;
  height: 44px;
  font-size: 1.3rem;
  cursor: pointer;
}

/* Mobile Nav Drawer */
.mobile-drawer {
  display: none;
  position: fixed;
  inset: 72px 0 0 0;
  background: rgba(7, 7, 10, 0.96);
  backdrop-filter: blur(20px);
  z-index: 99;
  padding: 24px;
  flex-direction: column;
  gap: 16px;
  border-bottom: 1px solid var(--line);
  animation: slideDown 0.25s ease-out;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

header.open + .mobile-drawer { display: flex; }

@media (max-width: 960px) {
  .burger { display: flex; align-items: center; justify-content: center; }
  nav.links, .navsr, .navcta { display: none; }
}

/* Layout & Sections */
main { flex: 1; }
section { padding: 80px 0; }
section.sm { padding: 40px 0; }

.eyebrow {
  color: var(--red);
  font: 700 0.78rem var(--font-mono);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  margin-bottom: 12px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.eyebrow:before {
  content: "";
  width: 8px;
  height: 8px;
  background: var(--red);
  border-radius: 2px;
  box-shadow: 0 0 8px var(--red);
}

/* Hero Section */
.hero {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 48px;
  align-items: center;
  padding: 90px 0 70px;
}

.hero p {
  color: var(--mut);
  font-size: 1.15rem;
  max-width: 580px;
  line-height: 1.7;
}

.hero-stats {
  display: flex;
  gap: 24px;
  margin-top: 36px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
}

.stat-item {
  display: flex;
  flex-direction: column;
}

.stat-num {
  font: 700 1.6rem var(--font-head);
  color: #fff;
}

.stat-lbl {
  font-size: 0.82rem;
  color: var(--mut);
}

.row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 32px; }

.hero .vis {
  position: relative;
  aspect-ratio: 1;
  border: 1px solid var(--line);
  border-radius: 24px;
  background: radial-gradient(circle at 50% 40%, #1a1217, #09090d 70%);
  display: grid;
  place-items: center;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 30px rgba(255, 42, 59, 0.05);
}

.hero .vis:hover .circuit-bg { transform: scale(1.05); }

.circuit-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

.hero-logo-img {
  width: 88%;
  height: 88%;
  object-fit: contain;
  border-radius: 20px;
  position: relative;
  z-index: 2;
  filter: drop-shadow(0 0 25px rgba(255, 42, 59, 0.45));
  transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), filter 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}

.hero .vis:hover .hero-logo-img {
  transform: scale(1.04);
  filter: drop-shadow(0 0 35px rgba(255, 42, 59, 0.7));
}

/* Grid & Cards */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 24px;
}

.card {
  background: linear-gradient(180deg, var(--card), #0a0b10);
  border: 1px solid var(--line);
  border-radius: var(--r);
  overflow: hidden;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  position: relative;
}

.card:hover {
  border-color: rgba(255, 42, 59, 0.4);
  transform: translateY(-6px);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 42, 59, 0.12);
}

.pimg {
  aspect-ratio: 4/3;
  background: #09090d;
  border-bottom: 1px solid var(--line);
  overflow: hidden;
  position: relative;
  display: block;
}

.pimg svg {
  width: 100%;
  height: 100%;
  transition: transform 0.5s ease;
}

.card:hover .pimg svg { transform: scale(1.06); }

.cb {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}

.cb h3 { margin: 4px 0 0; font-size: 1.25rem; }
.cb p { color: var(--mut); font-size: 0.9rem; margin: 0; line-height: 1.5; }

.tag {
  font: 600 0.7rem var(--font-mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--cyan);
  background: var(--cyan-bg);
  border: 1px solid rgba(0, 229, 255, 0.3);
  border-radius: 99px;
  padding: 3px 10px;
  align-self: flex-start;
}

.price {
  font: 700 1.45rem var(--font-mono);
  color: #fff;
}

.status-badge {
  font: 600 0.82rem var(--font-sans);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.status-badge.ok { color: var(--green); }
.status-badge.no { color: var(--amber); }

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}

.status-badge.ok .status-dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
.status-badge.no .status-dot { background: var(--amber); box-shadow: 0 0 8px var(--amber); }

.key {
  font: 400 0.83rem var(--font-mono);
  color: var(--silver);
  background: rgba(255, 255, 255, 0.03);
  padding: 6px 10px;
  border-radius: 6px;
  border-left: 2px solid var(--red);
}

.acts {
  display: flex;
  gap: 8px;
  margin-top: auto;
  padding-top: 14px;
  flex-wrap: wrap;
}

.acts .btn { flex: 1; }

/* Filter Bar & Chips */
.bar {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  align-items: center;
}

.bar > * { flex: 1; min-width: 160px; }

.chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}

.chip {
  border: 1px solid var(--line);
  background: #0d0e14;
  color: var(--mut);
  border-radius: 99px;
  padding: 7px 16px;
  cursor: pointer;
  font: 500 0.85rem var(--font-sans);
  transition: all 0.2s;
  user-select: none;
}

.chip:hover {
  color: var(--tx);
  border-color: var(--silver);
  background: #141520;
}

.chip.on {
  border-color: var(--red);
  color: #fff;
  background: rgba(255, 42, 59, 0.15);
  box-shadow: 0 0 12px rgba(255, 42, 59, 0.2);
}

/* Steps / Workflow */
.steps {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  counter-reset: s;
}

.steps div {
  counter-increment: s;
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 22px;
  background: var(--card);
  position: relative;
  transition: border-color 0.2s;
}

.steps div:hover { border-color: rgba(255, 42, 59, 0.4); }

.steps div:before {
  content: "0" counter(s);
  font: 700 2rem var(--font-head);
  color: var(--red);
  display: block;
  margin-bottom: 8px;
}

.steps small { color: var(--mut); line-height: 1.4; display: block; margin-top: 4px; }

/* Product Details Page */
.specs-table {
  width: 100%;
  border-collapse: collapse;
}

.specs-table td, .specs-table th {
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
  font-size: 0.92rem;
}

.specs-table th {
  color: var(--mut);
  font-weight: 500;
  width: 32%;
  font-family: var(--font-mono);
}

.specs-table td { color: var(--tx); }

.two {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
}

@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; padding-top: 40px; }
  .two { grid-template-columns: 1fr; }
}

.panel {
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--card);
  padding: 26px;
}

/* Flasher Console */
.log {
  background: #040407;
  border: 1px solid var(--line);
  border-radius: 10px;
  font: 0.85rem/1.55 var(--font-mono);
  color: #79c0ff;
  padding: 16px;
  height: 200px;
  overflow-y: auto;
  white-space: pre-wrap;
  box-shadow: inset 0 2px 10px rgba(0,0,0,0.8);
}

.log .err { color: #ff7b72; }
.log .ok { color: #56d364; }
.log .info { color: #d2a8ff; }

.prog {
  height: 10px;
  border-radius: 99px;
  background: #141520;
  overflow: hidden;
  margin: 16px 0;
  border: 1px solid var(--line);
}

.prog i {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--red2), var(--red), var(--cyan));
  transition: width 0.3s ease;
  box-shadow: 0 0 10px var(--red);
}

.pipe {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.pipe span {
  font: 500 0.8rem var(--font-mono);
  padding: 5px 12px;
  border-radius: 99px;
  border: 1px solid var(--line);
  color: var(--mut);
  background: #090a10;
  transition: all 0.2s;
}

.pipe .on {
  color: #fff;
  border-color: var(--red);
  background: rgba(255, 42, 59, 0.15);
  box-shadow: 0 0 10px rgba(255, 42, 59, 0.2);
}

.note {
  border-left: 4px solid var(--red);
  background: rgba(255, 42, 59, 0.06);
  padding: 16px 20px;
  border-radius: 0 12px 12px 0;
  color: var(--silver);
  font-size: 0.95rem;
  line-height: 1.6;
}

details {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 12px;
  background: var(--card);
  transition: border-color 0.2s;
}

details[open] { border-color: rgba(255, 42, 59, 0.3); }

summary {
  cursor: pointer;
  font-weight: 600;
  font-size: 1rem;
  color: #fff;
  user-select: none;
}

details p {
  color: var(--mut);
  margin: 12px 0 0;
  line-height: 1.6;
}

label {
  display: block;
  font: 600 0.85rem var(--font-sans);
  color: var(--silver);
  margin: 14px 0 6px;
}

input, select, textarea {
  width: 100%;
  background: #090a10;
  border: 1px solid var(--line);
  color: var(--tx);
  border-radius: 10px;
  padding: 12px 16px;
  font-family: var(--font-sans);
  font-size: 0.95rem;
  transition: all 0.2s;
}

/* Footer */
footer {
  border-top: 1px solid var(--line);
  background: #040407;
  padding: 64px 0 32px;
  margin-top: 60px;
}

.fg {
  display: grid;
  grid-template-columns: 1.5fr repeat(4, 1fr);
  gap: 32px;
}

@media (max-width: 860px) {
  .fg { grid-template-columns: 1fr 1fr; }
}

footer h4 { margin: 0 0 16px; }

footer a {
  display: block;
  color: var(--mut);
  font-size: 0.9rem;
  padding: 4px 0;
  transition: color 0.2s;
}

footer a:hover { color: #fff; }

.copy {
  border-top: 1px solid var(--line);
  margin-top: 48px;
  padding-top: 24px;
  color: var(--mut);
  font-size: 0.88rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

/* Reveal Animations */
.rv {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

.rv.in {
  opacity: 1;
  transform: none;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
  .rv { opacity: 1; transform: none; }
}

/* Article Styling */
.art h2 { margin-top: 1.8em; font-size: 1.8rem; }
.art h3 { margin-top: 1.4em; }
.art p { color: #c8cbd4; font-size: 1.05rem; line-height: 1.7; }
.art code { font-family: var(--font-mono); background: #0b0c12; border: 1px solid var(--line); padding: 2px 6px; border-radius: 4px; color: var(--cyan); }
.art pre { background: #040407; border: 1px solid var(--line); padding: 18px; border-radius: 10px; overflow-x: auto; font-family: var(--font-mono); color: #e9eaed; line-height: 1.5; }

/* Slide-over Cart / Quick Order Drawer */
.drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(8px);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.drawer-overlay.open {
  opacity: 1;
  pointer-events: auto;
}

.cart-drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  max-width: 440px;
  background: #0a0b10;
  border-left: 1px solid var(--line);
  z-index: 201;
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  padding: 24px;
}

.drawer-overlay.open .cart-drawer {
  transform: translateX(0);
}

.drawer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--line);
}

.drawer-header h3 { margin: 0; font-size: 1.4rem; }

.close-btn {
  background: none;
  border: 1px solid var(--line);
  color: var(--tx);
  border-radius: 8px;
  width: 36px;
  height: 36px;
  font-size: 1.2rem;
  cursor: pointer;
  display: grid;

/* ===== AFTER ROUTE INTERACTION HANDLERS ===== */
function after(path, qs) {
  if (path === "/store") {
    let cat = qs.get("c") || "All";
    let qVal = qs.get("q") || "";
    const qi = $("#q"), so = $("#so");
    if (qi) qi.value = qVal;
    
    const drawStore = () => {
      const chipContainer = $("#ch");
      if (!chipContainer) return;
      
      chipContainer.innerHTML = ["All", ...CATS].map(c => `<button class="chip ${c === cat ? "on" : ""}" data-c="${c}">${c}</button>`).join("");
      
      let filtered = PRODUCTS.filter(p => {
        const matchesCat = (cat === "All" || p.cat === cat);
        const searchTerms = (qi.value || "").toLowerCase();
        const matchesSearch = (p.name + p.short + p.cat + p.key + Object.values(p.specs).join(" ")).toLowerCase().includes(searchTerms);
        return matchesCat && matchesSearch;
      });
      
      const sortMode = so ? so.value : "f";
      if (sortMode === "l") filtered.sort((x, y) => x.price - y.price);
      if (sortMode === "h") filtered.sort((x, y) => y.price - x.price);
      if (sortMode === "n") filtered.sort((x, y) => (y.isNew ? 1 : 0) - (x.isNew ? 1 : 0));
      
      $("#pg").innerHTML = filtered.length ? filtered.map(card).join("") : '<p class="muted" style="grid-column:1/-1;text-align:center;padding:40px 0">No devices match your search filters.</p>';
      reveal();
    };
    
    $("#ch").onclick = e => {
      if (e.target.classList.contains("chip")) {
        cat = e.target.dataset.c;
        drawStore();
      }
    };
    
    if (qi) qi.oninput = drawStore;
    if (so) so.onchange = drawStore;
    drawStore();
  }
  
  if (path === "/blogs") {
    let cat = "All";
    const bq = $("#bq");
    
    const drawBlogs = () => {
      const chipContainer = $("#bc");
      if (!chipContainer) return;
      
      chipContainer.innerHTML = BCATS.map(c => `<button class="chip ${c === cat ? "on" : ""}" data-c="${c}">${c}</button>`).join("");
      
      const searchTerms = (bq ? bq.value : "").toLowerCase();
      let filtered = POSTS.filter(p => {
        const matchesCat = (cat === "All" || p.c === cat);
        const matchesSearch = (p.t + p.b + p.c + p.a).toLowerCase().includes(searchTerms);
        return matchesCat && matchesSearch;
      });
      
      $("#bgd").innerHTML = filtered.length ? filtered.map(p => `
        <a class="card rv" href="#/b/${p.id}">
          <div class="cb">
            <span class="tag">${p.c}</span>
            <h3>${p.t}</h3>
            <p>${p.a} · ${p.d}</p>
          </div>
        </a>
      `).join("") : '<p class="muted">No research articles match your query.</p>';
      reveal();
    };
    
    $("#bc").onclick = e => {
      if (e.target.classList.contains("chip")) {
        cat = e.target.dataset.c;
        drawBlogs();
      }
    };
    
    if (bq) bq.oninput = drawBlogs;
    drawBlogs();
  }
  
  if (path === "/contact") {
    const cf = $("#cf");
    if (cf) {
      cf.onsubmit = e => {
        e.preventDefault();
        const name = $("#cn_name").value;
        const email = $("#cn_email").value;
        const sub = $("#cn_sub").value;
        const msg = $("#cn_msg").value;
        
        location.href = `mailto:${CONFIG.email}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(msg + "\n\n— Submitted by: " + name + " (" + email + ")")}`;
      };
    }
  }
  
  if (path === "/flasher") {
    initFlasherTool();
  }
}

/* ===== WEB SERIAL FLASHER CONTROLLER ===== */
function initFlasherTool() {
  let port = null;
  const lg = $("#lg");
  const log = (t, type = "") => {
    if (!lg) return;
    const span = document.createElement("div");
    if (type) span.className = type;
    span.textContent = t;
    lg.appendChild(span);
    lg.scrollTop = lg.scrollHeight;
  };
  
  const setStep = i => {
    const pipe = $("#pp");
    if (!pipe) return;
    [...pipe.children].forEach((s, k) => s.classList.toggle("on", k <= i));
  };
  
  const setStatus = text => {
    const fs = $("#fs");
    if (fs) fs.textContent = text;
  };

  const cnBtn = $("#cnBtn");
  const flBtn = $("#flBtn");
  const demoBtn = $("#demoBtn");
  
  if (cnBtn) {
    cnBtn.onclick = async () => {
      if (!("serial" in navigator)) {
        log("Web Serial API is not supported in this browser. Please use Google Chrome, MS Edge, or Opera.", "err");
        return;
      }
      try {
        setStep(0);
        log("Requesting USB Web Serial Port access…", "info");
        port = await navigator.serial.requestPort();
        const info = port.getInfo();
        setStep(1);
        setStatus("Status: Connected to COM Port");
        log(`[+] Port Opened. USB Vendor ID: 0x${(info.usbVendorId || 0).toString(16)}, Product ID: 0x${(info.usbProductId || 0).toString(16)}`, "ok");
        setStep(2);
        if (flBtn) flBtn.disabled = false;
      } catch (e) {
        log("[-] Connection cancelled or port request failed: " + e.message, "err");
      }
    };
  }
  
  if (flBtn) {
    flBtn.onclick = () => {
      const select = $("#fwSelect");
      const deviceIndex = select ? select.value : 0;
      const device = FLASH_DEVICES[deviceIndex];
      
      log(`[!] Initiating Flashing Sequence for ${device.dev}…`, "info");
      setStep(3);
      
      let progress = 0;
      const pb = $("#pb");
      const interval = setInterval(() => {
        progress += 10;
        if (pb) pb.style.width = progress + "%";
        log(`Writing firmware block 0x${(progress * 1000).toString(16)}… (${progress}%)`, "ok");
        if (progress >= 100) {
          clearInterval(interval);
          setStep(4);
          log("[✓] Flashing Complete! Firmware verified successfully. Resetting device…", "ok");
          setStatus("Status: Flashing Complete");
        }
      }, 300);
    };
  }

  if (demoBtn) {
    demoBtn.onclick = () => {
      log("--- Starting Simulated Flasher Demo ---", "info");
      setStep(0);
      setTimeout(() => {
        setStep(1);
        log("[+] Detected ESP32-D0WDQ6 (revision v1.0)", "ok");
        log("Chip ID: 0x84f3eb12 | MAC: 24:6F:28:AB:C1:90", "info");
        setStep(2);
      }, 600);
      
      setTimeout(() => {
        setStep(3);
        log("Erasing flash memory partitions…", "info");
        let p = 0;
        const pb = $("#pb");
        const timer = setInterval(() => {
          p += 20;
          if (pb) pb.style.width = p + "%";
          log(`Writing partition table & flash binary (${p}%)`, "ok");
          if (p >= 100) {
            clearInterval(timer);
            setStep(4);
            log("[✓] Simulated Flashing Successful! Board is ready.", "ok");
            setStatus("Status: Demo Flash Finished");
          }
        }, 300);
      }, 1400);
    };
  }
}

/* ===== ROUTER ===== */
function reveal() {
  const io = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("in");
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });
  
  document.querySelectorAll(".rv:not(.in)").forEach(el => io.observe(el));
}

function route() {
  const hash = location.hash.slice(1) || "/";
  const [path, q] = hash.split("?");
  const seg = path.split("/");
  let key = seg[1] || "home";
  
  let contentHtml;
  if (key === "p" || key === "b") {
    contentHtml = pages[key](seg[2]);
  } else {
    contentHtml = (pages[key] || pages.nf)();
  }
  
  $("#app").innerHTML = contentHtml;
  
  // Highlight navigation link
  $("#nv").innerHTML = NAV.map(n => {
    const isCurrent = (n[1] === path) || (n[1] !== "/" && path.startsWith(n[1]));
    return `<a href="#${n[1]}" class="${isCurrent ? "on" : ""}">${n[0]}</a>`;
  }).join("");
  
  $("#hd").classList.remove("open");
  window.scrollTo(0, 0);
  
  after("/" + (seg[1] || ""), new URLSearchParams(q || ""));
  reveal();
  
  // Update document header title
  const pageTitle = (key === "home" ? "" : key.charAt(0).toUpperCase() + key.slice(1) + " · ");
  document.title = pageTitle + "RootCircuits — Hardware Built for Security Research";
}

/* ===== INITIALIZATION ===== */
window.addEventListener("hashchange", route);
window.addEventListener("DOMContentLoaded", () => {
  initChrome();
  loadCart();
  route();
});
</script>
